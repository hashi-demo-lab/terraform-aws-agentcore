# Worked example: 5-rule subset of CIS AWS Foundations Benchmark v3.0.0 covering S3.
# Every field populated; mixed provenance illustrates the dotted-key form and how
# different sources combine (conformance pack for source.identifier, Security Hub
# for severity/title/requirement, Config developer guide for documentation_url, and
# manual-human for condition.logic). Useful as a reference for the model when
# producing larger outputs.
metadata:
  framework:
    name: CIS AWS Foundations Benchmark
    version: "3.0.0"
    scope: S3 only (worked example)
  source: https://docs.aws.amazon.com/securityhub/latest/userguide/cis-aws-foundations-benchmark.html
  generated_by: tf-research-policy-aws
  generated_at: "2026-05-08"
  notes: >-
    Five-rule worked example. Severities mirror Security Hub's mapping of CIS
    controls onto FSBP. condition.logic values are hand-distilled from each
    rule's "How the rule evaluates resources" section in the AWS Config
    developer guide.

rules:
  - id: s3-bucket-public-read-prohibited
    title: S3 buckets must not allow public read access
    framework_control:
      id: CIS 2.1.5.1
      title: Ensure that S3 Buckets are configured with 'Block public access (bucket settings)'
      requirement: >-
        Amazon S3 provides Block public access (bucket settings) and Block
        public access (account settings) to help you manage public access to
        Amazon S3 resources. By default, S3 buckets and objects are created
        with public access disabled. However, an IAM principal with sufficient
        S3 permissions can enable public access at the bucket and/or object
        level.
    related_controls:
      - framework: NIST 800-53 Rev 5
        id: AC-3
      - framework: PCI DSS v4.0
        id: "1.2.1"
    severity: HIGH
    service: s3
    resource_types:
      - AWS::S3::Bucket
    source:
      type: aws-config-managed-rule
      identifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
      documentation_url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-public-read-prohibited.html
      parameters: {}
    security_hub:
      standard: cis-aws-foundations-benchmark
      control_id: S3.2
      documentation_url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-2
    condition:
      description: >-
        The S3 bucket must not allow public read access. Either Block Public
        Access settings prevent public ACLs, or no bucket policy / ACL grants
        AllUsers / AuthenticatedUsers read access.
      parameters: {}
      logic: |
        resource.PublicAccessBlockConfiguration.BlockPublicAcls == true
        AND resource.PublicAccessBlockConfiguration.IgnorePublicAcls == true
        AND no policy statement grants s3:GetObject to Principal: "*" or AuthenticatedUsers
    remediation:
      summary: >-
        Enable Block Public Access at the bucket level (and ideally at the
        account level). Remove any ACL or bucket-policy statements granting
        public read.
      terraform_snippet: |
        resource "aws_s3_bucket_public_access_block" "example" {
          bucket                  = aws_s3_bucket.example.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }
    references:
      - title: AWS Config managed rule s3-bucket-public-read-prohibited
        url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-public-read-prohibited.html
      - title: Security Hub control S3.2
        url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-2
    test_cases:
      - name: bucket with Block Public Access enabled passes
        input:
          resource_type: AWS::S3::Bucket
          properties:
            PublicAccessBlockConfiguration:
              BlockPublicAcls: true
              IgnorePublicAcls: true
              BlockPublicPolicy: true
              RestrictPublicBuckets: true
        expected: COMPLIANT
      - name: bucket with public-read ACL fails
        input:
          resource_type: AWS::S3::Bucket
          properties:
            AccessControl: PublicRead
        expected: NON_COMPLIANT
    tags:
      - data-protection
      - public-access
      - s3
    provenance:
      framework_control.id: aws-conformance-pack
      framework_control.title: aws-security-hub
      framework_control.requirement: aws-security-hub
      severity: aws-security-hub
      source.identifier: aws-conformance-pack
      source.documentation_url: aws-config-managed-rule-doc
      source.parameters: aws-conformance-pack
      resource_types: aws-conformance-pack
      condition.description: aws-config-managed-rule-doc
      condition.logic: manual-human
      remediation.summary: aws-config-managed-rule-doc
      remediation.terraform_snippet: manual-human
      references: [aws-conformance-pack, aws-security-hub, aws-config-managed-rule-doc]
      test_cases: aws-guard-registry
      tags: manual-human
      security_hub: aws-security-hub

  - id: s3-bucket-public-write-prohibited
    title: S3 buckets must not allow public write access
    framework_control:
      id: CIS 2.1.5.2
      title: Ensure that S3 Buckets are configured to deny public write access
      requirement: >-
        Public write access to S3 buckets allows anonymous users to upload or
        modify objects. CIS recommends configuring buckets so that no
        principal-less policy or ACL grants s3:PutObject.
    related_controls:
      - framework: NIST 800-53 Rev 5
        id: AC-3
    severity: HIGH
    service: s3
    resource_types:
      - AWS::S3::Bucket
    source:
      type: aws-config-managed-rule
      identifier: S3_BUCKET_PUBLIC_WRITE_PROHIBITED
      documentation_url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-public-write-prohibited.html
      parameters: {}
    security_hub:
      standard: cis-aws-foundations-benchmark
      control_id: S3.3
      documentation_url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-3
    condition:
      description: >-
        The S3 bucket must not allow public write access via ACL or bucket
        policy. Block Public Access settings should also be enabled.
      parameters: {}
      logic: |
        resource.PublicAccessBlockConfiguration.BlockPublicPolicy == true
        AND no policy statement grants s3:PutObject to Principal: "*" or AuthenticatedUsers
    remediation:
      summary: >-
        Enable Block Public Access settings and remove any policy statement
        with `Principal: "*"` granting `s3:PutObject` (or any other write
        action).
      terraform_snippet: |
        resource "aws_s3_bucket_public_access_block" "example" {
          bucket                  = aws_s3_bucket.example.id
          block_public_policy     = true
          restrict_public_buckets = true
        }
    references:
      - title: AWS Config managed rule s3-bucket-public-write-prohibited
        url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-public-write-prohibited.html
      - title: Security Hub control S3.3
        url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-3
    test_cases:
      - name: bucket with no public-write policy passes
        input:
          resource_type: AWS::S3::Bucket
          properties:
            PublicAccessBlockConfiguration:
              BlockPublicPolicy: true
              RestrictPublicBuckets: true
        expected: COMPLIANT
      - name: bucket allowing PutObject from "*" fails
        input:
          resource_type: AWS::S3::Bucket
          properties:
            BucketPolicy:
              Statement:
                - Effect: Allow
                  Principal: "*"
                  Action: s3:PutObject
        expected: NON_COMPLIANT
    tags:
      - data-protection
      - public-access
      - s3
    provenance:
      framework_control.id: aws-conformance-pack
      framework_control.title: aws-security-hub
      framework_control.requirement: aws-security-hub
      severity: aws-security-hub
      source.identifier: aws-conformance-pack
      source.documentation_url: aws-config-managed-rule-doc
      resource_types: aws-conformance-pack
      condition.description: aws-config-managed-rule-doc
      condition.logic: manual-human
      remediation.summary: aws-config-managed-rule-doc
      remediation.terraform_snippet: manual-human
      references: [aws-conformance-pack, aws-security-hub, aws-config-managed-rule-doc]
      test_cases: aws-guard-registry
      security_hub: aws-security-hub

  - id: s3-bucket-server-side-encryption-enabled
    title: S3 buckets must have server-side encryption enabled
    framework_control:
      id: CIS 2.1.1
      title: Ensure all S3 buckets employ encryption-at-rest
      requirement: >-
        Amazon S3 default encryption automatically encrypts objects when they
        are uploaded. CIS requires this be enabled with at least AES-256 or
        AWS-KMS encryption.
    related_controls:
      - framework: NIST 800-53 Rev 5
        id: SC-28
      - framework: PCI DSS v4.0
        id: "3.5.1"
    severity: MEDIUM
    service: s3
    resource_types:
      - AWS::S3::Bucket
    source:
      type: aws-config-managed-rule
      identifier: S3_BUCKET_SERVER_SIDE_ENCRYPTION_ENABLED
      documentation_url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-server-side-encryption-enabled.html
      parameters: {}
    security_hub:
      standard: cis-aws-foundations-benchmark
      control_id: S3.4
      documentation_url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-4
    condition:
      description: >-
        The S3 bucket must have a default encryption rule (SSE-S3 or SSE-KMS)
        configured.
      parameters: {}
      logic: |
        resource.BucketEncryption.ServerSideEncryptionConfiguration[*].ServerSideEncryptionByDefault.SSEAlgorithm
          in {"AES256", "aws:kms"}
    remediation:
      summary: >-
        Add a server-side encryption configuration to the bucket. Prefer
        SSE-KMS with a customer-managed key when key rotation and audit
        granularity are required.
      terraform_snippet: |
        resource "aws_s3_bucket_server_side_encryption_configuration" "example" {
          bucket = aws_s3_bucket.example.id
          rule {
            apply_server_side_encryption_by_default {
              sse_algorithm     = "aws:kms"
              kms_master_key_id = aws_kms_key.s3.arn
            }
          }
        }
    references:
      - title: AWS Config managed rule s3-bucket-server-side-encryption-enabled
        url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-server-side-encryption-enabled.html
      - title: Security Hub control S3.4
        url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-4
    test_cases:
      - name: bucket with SSE-KMS default encryption passes
        input:
          resource_type: AWS::S3::Bucket
          properties:
            BucketEncryption:
              ServerSideEncryptionConfiguration:
                - ServerSideEncryptionByDefault:
                    SSEAlgorithm: aws:kms
                    KMSMasterKeyID: arn:aws:kms:us-east-1:111122223333:key/abcd
        expected: COMPLIANT
      - name: bucket with no encryption configuration fails
        input:
          resource_type: AWS::S3::Bucket
          properties: {}
        expected: NON_COMPLIANT
    tags:
      - encryption-at-rest
      - data-protection
      - s3
    provenance:
      framework_control.id: aws-conformance-pack
      framework_control.title: aws-security-hub
      framework_control.requirement: aws-security-hub
      severity: aws-security-hub
      source.identifier: aws-conformance-pack
      source.documentation_url: aws-config-managed-rule-doc
      resource_types: aws-conformance-pack
      condition.description: aws-config-managed-rule-doc
      condition.logic: manual-human
      remediation.summary: aws-config-managed-rule-doc
      remediation.terraform_snippet: manual-human
      references: [aws-conformance-pack, aws-security-hub, aws-config-managed-rule-doc]
      test_cases: aws-guard-registry
      security_hub: aws-security-hub

  - id: s3-bucket-ssl-requests-only
    title: S3 buckets must require requests to use TLS
    framework_control:
      id: CIS 2.1.2
      title: Ensure S3 Bucket Policy is set to deny HTTP requests
      requirement: >-
        Amazon S3 buckets must enforce encryption in transit by denying
        requests that do not use TLS. The bucket policy must include a Deny
        statement for `aws:SecureTransport: "false"`.
    related_controls:
      - framework: NIST 800-53 Rev 5
        id: SC-8
      - framework: PCI DSS v4.0
        id: "4.2.1"
    severity: MEDIUM
    service: s3
    resource_types:
      - AWS::S3::Bucket
    source:
      type: aws-config-managed-rule
      identifier: S3_BUCKET_SSL_REQUESTS_ONLY
      documentation_url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-ssl-requests-only.html
      parameters: {}
    security_hub:
      standard: cis-aws-foundations-benchmark
      control_id: S3.5
      documentation_url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-5
    condition:
      description: >-
        The bucket policy must contain a Deny statement on s3:* (or all S3
        actions) when aws:SecureTransport is "false".
      parameters: {}
      logic: |
        exists policy statement where Effect == "Deny"
          AND Action covers s3:*
          AND Condition.Bool["aws:SecureTransport"] == "false"
    remediation:
      summary: >-
        Add a bucket policy statement denying any action when the request is
        not over TLS. The standard pattern uses `aws:SecureTransport` in the
        Condition block.
      terraform_snippet: |
        data "aws_iam_policy_document" "tls_only" {
          statement {
            sid       = "DenyInsecureTransport"
            effect    = "Deny"
            actions   = ["s3:*"]
            resources = [aws_s3_bucket.example.arn, "${aws_s3_bucket.example.arn}/*"]
            principals {
              type        = "*"
              identifiers = ["*"]
            }
            condition {
              test     = "Bool"
              variable = "aws:SecureTransport"
              values   = ["false"]
            }
          }
        }
    references:
      - title: AWS Config managed rule s3-bucket-ssl-requests-only
        url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-ssl-requests-only.html
      - title: Security Hub control S3.5
        url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-5
    test_cases:
      - name: bucket with TLS-only deny statement passes
        input:
          resource_type: AWS::S3::Bucket
          properties:
            BucketPolicy:
              Statement:
                - Effect: Deny
                  Action: "s3:*"
                  Condition:
                    Bool:
                      aws:SecureTransport: "false"
        expected: COMPLIANT
      - name: bucket with no TLS enforcement fails
        input:
          resource_type: AWS::S3::Bucket
          properties: {}
        expected: NON_COMPLIANT
    tags:
      - encryption-in-transit
      - s3
    provenance:
      framework_control.id: aws-conformance-pack
      framework_control.title: aws-security-hub
      framework_control.requirement: aws-security-hub
      severity: aws-security-hub
      source.identifier: aws-conformance-pack
      source.documentation_url: aws-config-managed-rule-doc
      resource_types: aws-conformance-pack
      condition.description: aws-config-managed-rule-doc
      condition.logic: manual-human
      remediation.summary: aws-config-managed-rule-doc
      remediation.terraform_snippet: manual-human
      references: [aws-conformance-pack, aws-security-hub, aws-config-managed-rule-doc]
      test_cases: aws-guard-registry
      security_hub: aws-security-hub

  - id: s3-bucket-versioning-enabled
    title: S3 buckets must have versioning enabled
    framework_control:
      id: CIS 2.1.3
      title: Ensure MFA Delete is enabled on S3 buckets
      requirement: >-
        S3 versioning protects against accidental or malicious deletion or
        overwrite of objects. CIS additionally recommends MFA Delete; this
        rule covers the underlying versioning prerequisite.
    related_controls:
      - framework: NIST 800-53 Rev 5
        id: CP-10
    severity: LOW
    service: s3
    resource_types:
      - AWS::S3::Bucket
    source:
      type: aws-config-managed-rule
      identifier: S3_BUCKET_VERSIONING_ENABLED
      documentation_url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-versioning-enabled.html
      parameters: {}
    security_hub:
      standard: cis-aws-foundations-benchmark
      control_id: S3.14
      documentation_url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-14
    condition:
      description: >-
        The bucket's VersioningConfiguration.Status must be "Enabled".
      parameters: {}
      logic: |
        resource.VersioningConfiguration.Status == "Enabled"
    remediation:
      summary: >-
        Set the bucket's versioning configuration to Enabled. For
        production-tier buckets, also consider enabling MFA Delete.
      terraform_snippet: |
        resource "aws_s3_bucket_versioning" "example" {
          bucket = aws_s3_bucket.example.id
          versioning_configuration {
            status = "Enabled"
          }
        }
    references:
      - title: AWS Config managed rule s3-bucket-versioning-enabled
        url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-versioning-enabled.html
      - title: Security Hub control S3.14
        url: https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-14
    test_cases:
      - name: bucket with versioning Enabled passes
        input:
          resource_type: AWS::S3::Bucket
          properties:
            VersioningConfiguration:
              Status: Enabled
        expected: COMPLIANT
      - name: bucket with versioning Suspended fails
        input:
          resource_type: AWS::S3::Bucket
          properties:
            VersioningConfiguration:
              Status: Suspended
        expected: NON_COMPLIANT
    tags:
      - data-protection
      - backup-recovery
      - s3
    provenance:
      framework_control.id: aws-conformance-pack
      framework_control.title: aws-security-hub
      framework_control.requirement: aws-security-hub
      severity: aws-security-hub
      source.identifier: aws-conformance-pack
      source.documentation_url: aws-config-managed-rule-doc
      resource_types: aws-conformance-pack
      condition.description: aws-config-managed-rule-doc
      condition.logic: manual-human
      remediation.summary: aws-config-managed-rule-doc
      remediation.terraform_snippet: manual-human
      references: [aws-conformance-pack, aws-security-hub, aws-config-managed-rule-doc]
      test_cases: aws-guard-registry
